name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.11.1'
  DOTNET_VERSION: '8.0.x'
  PNPM_VERSION: '9'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # .NET build + test — enforces today's invariants (Week-1 done):
  #   - solution restores cleanly
  #   - dotnet build AutoLeaseNet.sln succeeds with WarnAsError (set in
  #     Directory.Build.props); CI inherits — no extra flag needed
  #   - all 153 unit/integration tests pass with the .runsettings filter
  #     (Category=Smoke excluded; smoke runs separately when creds exist)
  # ─────────────────────────────────────────────────────────────────────────
  dotnet:
    name: .NET (build -warnaserror + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools (dotnet-ef 8.0.5)
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore AutoLeaseNet.sln

      - name: Build (Release, treat warnings as errors)
        run: dotnet build AutoLeaseNet.sln -c Release --no-restore

      - name: "Test (default filter: Category!=Smoke via .runsettings)"
        run: |
          dotnet test AutoLeaseNet.sln -c Release --no-build \
            --settings .runsettings \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" || exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ./TestResults/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # JS / pnpm — both portals build cleanly as of PRs #22 / #24, so Typecheck
  # and Build are now blocking. Lint + Test stay best-effort: the lint config
  # is still skeletal until design.md lands, and pnpm test has no real test
  # infra yet on either portal.
  # ─────────────────────────────────────────────────────────────────────────
  js:
    name: JS (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        continue-on-error: true

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────────────────────────────────────
  # Tajeer staging smoke — calls real Tajeer Rabet staging from CI.
  #
  # GATED BY THE `TAJEER_REAL_SMOKE_ENABLED` SECRET so dummy seeded
  # credentials never accidentally drive a real-vendor call. When the user
  # has rotated the placeholder secrets to real Tajeer Rabet credentials
  # (per Plans/.../STAGING-SMOKE.md), set the gate secret to "true":
  #
  #   gh secret set TAJEER_REAL_SMOKE_ENABLED -R stabrez07/AutoLeaseNet
  #   # paste: true
  #
  # Until then the step echoes "smoke skipped" and exits 0 so CI stays
  # green. Note: secret names below MUST match what was seeded in PR #3
  # (`_TOKEN`, `_ID`, `_SHARED_SECRET` suffixes) — previously mismatched.
  # ─────────────────────────────────────────────────────────────────────────
  tajeer-staging-smoke:
    name: Tajeer staging smoke (Category=Smoke)
    runs-on: ubuntu-latest
    needs: dotnet
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore + build smoke-test project
        run: |
          dotnet restore packages/adapters/AutoLeaseNet.Adapters.Tajeer.Tests/AutoLeaseNet.Adapters.Tajeer.Tests.csproj
          dotnet build packages/adapters/AutoLeaseNet.Adapters.Tajeer.Tests/AutoLeaseNet.Adapters.Tajeer.Tests.csproj -c Release --no-restore

      - name: Gate check + run smoke (or skip when gate not set)
        env:
          GATE: ${{ secrets.TAJEER_REAL_SMOKE_ENABLED }}
          TAJEER_TAJEER__APPID: ${{ secrets.TAJEER_APPID }}
          TAJEER_TAJEER__APPKEY: ${{ secrets.TAJEER_APPKEY }}
          TAJEER_TAJEER__AUTHORIZATIONTOKEN: ${{ secrets.TAJEER_AUTHORIZATION_TOKEN }}
          TAJEER_TAJEER__BRANCHID: ${{ secrets.TAJEER_BRANCH_ID }}
          TAJEER_TAJEER__WEBHOOKSHAREDSECRET: ${{ secrets.TAJEER_WEBHOOK_SHARED_SECRET }}
        run: |
          if [ "${GATE}" != "true" ]; then
            echo "TAJEER_REAL_SMOKE_ENABLED is not 'true' (got: '${GATE:-<unset>}'). Skipping smoke."
            echo "To enable: gh secret set TAJEER_REAL_SMOKE_ENABLED -R stabrez07/AutoLeaseNet  # value: true"
            echo "Also ensure real Tajeer Rabet credentials are in TAJEER_APPID / TAJEER_APPKEY / TAJEER_AUTHORIZATION_TOKEN / TAJEER_BRANCH_ID / TAJEER_WEBHOOK_SHARED_SECRET."
            exit 0
          fi
          dotnet test packages/adapters/AutoLeaseNet.Adapters.Tajeer.Tests \
            -c Release --no-build --filter Category=Smoke \
            --logger "console;verbosity=normal"
